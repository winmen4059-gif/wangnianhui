<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff5d6">
    <title>旺年會幸運抽獎</title>
    <link rel="stylesheet" href="./lottery.css">
</head>
<body>
    <main class="lottery-page">
        <header class="header">
            <div class="event-title">旺年會</div>
            <h1>🎁 幸運抽獎</h1>
            <p>祝大家好運，抽中豐富好禮！</p>
        </header>

        <section id="loading" class="card message-card">
            <div class="loading-spinner" aria-hidden="true"></div>
            <p>正在載入抽獎資料...</p>
        </section>

        <section id="error" class="card error-card hidden" role="alert">
            <div class="error-icon" aria-hidden="true">⚠️</div>
            <h2>系統發生錯誤</h2>
            <p id="errorMessage">無法載入抽獎資料。</p>
            <button id="retryButton" class="secondary-button" type="button">
                重新載入
            </button>
        </section>

        <section id="mainScreen" class="hidden">
            <section class="summary-grid">
                <article class="card summary-card">
                    <div class="summary-label">可抽獎人數</div>
                    <div id="eligibleCount" class="summary-value">0</div>
                </article>

                <article class="card summary-card">
                    <div class="summary-label">尚有名額獎項</div>
                    <div id="availablePrizeCount" class="summary-value">0</div>
                </article>
            </section>

            <section class="card status-card" aria-live="polite">
                <div class="status-icon" aria-hidden="true">🎟️</div>
                <h2 id="statusTitle">抽獎準備中</h2>
                <p id="statusMessage">正在確認抽獎名單與獎項...</p>
            </section>

            <section id="drawCard" class="draw-card">
                <div class="gift" aria-hidden="true">🎁</div>
                <h2>準備好抽出幸運得主了嗎？</h2>
                <p>按下按鈕，由系統從合資格名單抽出得獎者。</p>
                <button id="drawButton" class="draw-button" type="button" disabled>
                    正在確認抽獎資料...
                </button>
            </section>

            <section id="drawingCard" class="drawing-card hidden" aria-live="assertive">
                <div class="sparkles" aria-hidden="true">✨ 🎁 ✨</div>
                <div id="countdown" class="countdown">3</div>
                <h2>抽獎中...</h2>
                <p>請稍候</p>
            </section>

            <section id="resultCard" class="result-card hidden" aria-live="polite">
                <div class="result-icon" aria-hidden="true">🎉</div>
                <div class="result-title">恭喜得獎！</div>
                <div id="winnerName" class="winner-name">-</div>
                <div id="prizeName" class="prize-name">-</div>
                <div id="prizeDescription" class="prize-description"></div>
                <div id="resultMessage" class="result-message"></div>
                <button id="continueButton" class="secondary-button" type="button">
                    繼續抽獎
                </button>
            </section>

            <section class="card prize-card">
                <h2>🎁 獎項剩餘名額</h2>
                <div id="prizeList" class="prize-list">
                    <div class="empty-message">目前沒有獎項資料</div>
                </div>
            </section>

            <section class="card history-card">
                <h2>🏆 得獎紀錄</h2>
                <div id="winnerHistory" class="winner-list">
                    <div class="empty-message">目前還沒有得獎紀錄</div>
                </div>
            </section>
        </section>
    </main>

    <script src="./lottery.js"></script>
</body>
</html>
