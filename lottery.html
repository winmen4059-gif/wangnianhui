<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff5d6">
    <title>旺年會抽獎</title>
    <link rel="stylesheet" href="./lottery.css">
</head>
<body>
    <main class="lottery-page">
        <section class="header">
            <div class="event-title">旺年會</div>
            <h1>🎁 幸運抽獎</h1>
            <p>恭喜完成闖關，準備迎接你的好運！</p>
        </section>

        <section id="loading" class="card loading-card">
            <div class="loading-spinner" aria-hidden="true"></div>
            <p id="loadingText">正在初始化 LINE...</p>
        </section>

        <section id="loginScreen" class="card hidden">
            <div class="status-icon" aria-hidden="true">👤</div>
            <h2>請輸入員工工號</h2>
            <p>
                請輸入您的員工工號，<br>
                以確認旺年會抽獎資格。
            </p>

            <label class="visually-hidden" for="employeeNoInput">員工工號</label>
            <input
                type="text"
                id="employeeNoInput"
                class="employee-input"
                placeholder="請輸入員工工號"
                autocomplete="off"
                maxlength="50"
            >

            <button type="button" id="loginButton" class="draw-button">
                🚀 登入並確認資格
            </button>

            <div id="loginMessage" class="login-message" role="status"></div>
        </section>

        <section id="mainScreen" class="hidden">
            <section class="card participant-card">
                <div class="participant-icon" aria-hidden="true">👤</div>
                <div class="participant-details">
                    <div class="participant-label">參加者</div>
                    <div id="participantName" class="participant-name">-</div>
                </div>
            </section>

            <section class="card progress-card">
                <div class="progress-header">
                    <div class="progress-title">🎯 闖關進度</div>
                    <div id="progressText" class="progress-text">0 / 6</div>
                </div>

                <div
                    class="progress-bar"
                    role="progressbar"
                    aria-label="闖關進度"
                    aria-valuemin="0"
                    aria-valuemax="6"
                    aria-valuenow="0"
                >
                    <div id="progressBar" class="progress-fill" style="width: 0%;"></div>
                </div>

                <div id="missionProgress" class="mission-progress"></div>
            </section>

            <section id="lotteryArea">
                <section id="statusCard" class="card status-card" aria-live="polite">
                    <div class="status-icon" aria-hidden="true">🎟️</div>
                    <h2 id="statusTitle">抽獎資格確認中</h2>
                    <p id="statusMessage">正在確認您的抽獎資格...</p>
                </section>

                <section id="drawCard" class="draw-card">
                    <div class="gift-animation" aria-hidden="true">
                        <div class="gift">🎁</div>
                    </div>

                    <h2>準備好了嗎？</h2>
                    <p>按下按鈕，<br>看看今天的幸運獎項！</p>

                    <button type="button" id="drawButton" class="draw-button" disabled>
                        🎰 正在確認資格
                    </button>
                </section>

                <section id="drawingCard" class="drawing-card hidden" aria-live="assertive">
                    <div class="drawing-stars" aria-hidden="true">✨ 🎁 ✨ 🎁 ✨</div>
                    <div id="countdown" class="countdown">3</div>
                    <h2>幸運抽獎中...</h2>
                    <p>請稍候</p>
                </section>

                <section id="resultCard" class="result-card hidden" aria-live="polite">
                    <div id="resultIcon" class="result-icon" aria-hidden="true">🎉</div>
                    <div class="result-title">🎊 恭喜您！</div>
                    <div id="prizeName" class="prize-name">恭喜中獎</div>
                    <div id="prizeDescription" class="prize-description">-</div>
                    <div id="resultMessage" class="result-message">-</div>

                    <button type="button" id="drawAgainButton" class="draw-button hidden">
                        🎁 再抽一次
                    </button>

                    <button type="button" id="closeResultButton" class="secondary-button">
                        返回抽獎頁面
                    </button>
                </section>

                <section class="card history-card">
                    <div class="history-title">🏆 我的中獎紀錄</div>
                    <div id="winnerList" class="winner-list">
                        <div class="empty-history">目前還沒有中獎紀錄</div>
                    </div>
                </section>
            </section>
        </section>

        <section id="error" class="card error-card hidden" role="alert">
            <div class="error-icon" aria-hidden="true">⚠️</div>
            <h2>系統發生錯誤</h2>
            <p id="errorMessage">發生錯誤，請稍後再試。</p>
            <button type="button" id="retryButton" class="secondary-button">
                🔄 重新整理
            </button>
        </section>
    </main>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./lottery.js"></script>
</body>
</html>
