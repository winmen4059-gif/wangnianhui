</head> <body> <div class="container" id="app" >
<div class="logo">
    🎉
</div>

<h1>
    旺年會闖關
</h1>

<div class="subtitle">
    歡迎參加今年的旺年會活動！
</div>

<div
    class="user"
    id="userInfo"
>
    LINE 登入中...
</div>

<div
    id="registerArea"
>

    <input
        type="text"
        id="employeeNo"
        placeholder="請輸入員工工號"
        autocomplete="off"
        maxlength="50"
    >

    <button
        id="startButton"
        type="button"
        onclick="registerAndStart()"
        disabled
    >

    </button>

</div>

    class="message"
    id="message"
></div>

</div> <script>
// ==================================================
// 基本設定
// ==================================================

const LIFF_ID =
"2011685953-o8qvyQfR";

const API_BASE =
"https://newsapi.winmen.com.tw";

// ==================================================
// 六個關卡
// ==================================================

const MISSIONS = {

M01: {
    name: "飛鏢機"
},

M02: {
    name: "酒館推推樂"
},

M03: {
    name: "沙漠酒桶投擲"
},

M04: {
    name: "水彈射擊"
},

M05: {
    name: "套圈圈"
},

M06: {
    name: "牛仔腰力王"
}

};

// ==================================================
// 全域資料
// ==================================================

let currentIdToken = "";

let currentLineUserId = "";

let currentDisplayName = "";

let currentEmployeeNo = "";

let currentMissionCode = "";

let currentMissionToken = "";

// ==================================================
// DOM 工具
// ==================================================

function getElement(id) {

return document.getElementById(id);

}

// ==================================================
// 顯示訊息
// ==================================================

function setMessage(
message,
type = "error"
) {

const element =
    getElement("message");

if (!element) {

    return;

}

element.innerHTML =

    `<span class="${type}">
        ${escapeHtml(message)}
    </span>`;

}

// ==================================================
// 還原 Session
// ==================================================

function restoreSession() {

currentLineUserId =
    sessionStorage.getItem(
        "lineUserId"
    ) || currentLineUserId || "";

currentDisplayName =
    sessionStorage.getItem(
        "lineDisplayName"
    ) || currentDisplayName || "";

currentEmployeeNo =
    sessionStorage.getItem(
        "employeeNo"
    ) || currentEmployeeNo || "";

const employeeInput =
    getElement("employeeNo");

if (
    employeeInput &&
    currentEmployeeNo
) {

    employeeInput.value =
        currentEmployeeNo;

}

}

// ==================================================
// 儲存 Session
// ==================================================

function saveSession() {

if (currentLineUserId) {

    sessionStorage.setItem(
        "lineUserId",
        currentLineUserId
    );

}

if (currentDisplayName) {

    sessionStorage.setItem(
        "lineDisplayName",
        currentDisplayName
    );

}

if (currentEmployeeNo) {

    sessionStorage.setItem(
        "employeeNo",
        currentEmployeeNo
    );

}

}

// ==================================================
// API JSON 安全讀取
// ==================================================

async function readJson(
response
) {

const text =
    await response.text();

if (!text) {

    return {};

}

try {

    return JSON.parse(text);

}
catch {

    return {
        message: text
    };

}

}

// ==================================================
// LIFF 初始化
// ==================================================

async function initLIFF() {

try {

    console.log(
        "[LIFF] 初始化開始"
    );

    await liff.init({
        liffId: LIFF_ID
    });

    console.log(
        "[LIFF] 初始化成功"
    );

    // ==========================================
    // 尚未登入 LINE
    // ==========================================

    if (!liff.isLoggedIn()) {

        document.getElementById(
            "userInfo"
        ).innerHTML =

            `<span class="warning">
                正在開啟 LINE 登入...
            </span>`;

        liff.login({
            redirectUri:
                window.location.href
        });

        return;

    }

    // ==========================================
    // 取得 ID Token
    // ==========================================

    currentIdToken =
        liff.getIDToken();

    if (!currentIdToken) {

        throw new Error(
            "無法取得 LINE ID Token，請重新開啟 LIFF"
        );

    }

    console.log(
        "[LIFF] ID Token 已取得"
    );

    // ==========================================
    // 取得 LINE Profile
    // ==========================================

    const profile =
        await liff.getProfile();

    if (!profile ||
        !profile.userId) {

        throw new Error(
            "無法取得 LINE 使用者資料"
        );

    }

    currentLineUserId =
        profile.userId;

    currentDisplayName =
        profile.displayName || "";

    saveSession();

    document.getElementById(
        "userInfo"
    ).innerHTML =

        "你好，<strong>" +

        escapeHtml(
            currentDisplayName
        ) +

        "</strong> 👋<br>" +

        `<span class="small">
            LINE 登入成功
        </span>`;

    const startButton =
        getElement("startButton");

    if (startButton) {

        startButton.disabled =
            false;

    }

    // ==========================================
    // 還原工號
    // ==========================================

    restoreSession();

    // ==========================================
    // 先讀取 URL 的 QR Code
    // ==========================================

    readMissionQRCode();

    // ==========================================
    // 已有工號 → 自動查詢進度
    // ==========================================

    if (currentEmployeeNo) {

        try {

            await loadProgress();

        }
        catch (error) {

            console.log(
                "[LIFF] 尚未完成註冊:",
                error
            );

        }

    }

    // ==========================================
    // 如果 QR Code 已經存在
    // 且已有工號
    // 則自動完成關卡
    // ==========================================

    if (
        currentMissionCode &&
        currentMissionToken &&
        currentLineUserId &&
        currentEmployeeNo
    ) {

        await completeMission(
            currentMissionCode,
            currentMissionToken
        );

    }

}
catch (error) {

    console.error(
        "[LIFF] 初始化錯誤:",
        error
    );

    document.getElementById(
        "userInfo"
    ).innerHTML =

        `<span class="error">
            LINE 登入失敗
            <br><br>
            ${escapeHtml(
                error.message ||
                "未知錯誤"
            )}
        </span>`;

    const startButton =
        getElement("startButton");

    if (startButton) {

        startButton.disabled =
            true;

    }

}

}

// ==================================================
// 讀取 QR Code 參數
// ==================================================

function readMissionQRCode() {

const params =
    new URLSearchParams(
        window.location.search
    );

currentMissionCode =
    (
        params.get("mission") ||
        ""
    )
    .trim()
    .toUpperCase();

currentMissionToken =
    (
        params.get("token") ||
        ""
    )
    .trim();

console.log(
    "[QR] mission:",
    currentMissionCode
);

console.log(
    "[QR] token:",
    currentMissionToken
        ? "存在"
        : "不存在"
);

}

// ==================================================
// LINE + 工號註冊
// ==================================================

async function registerAndStart() {

console.log(
    "[REGISTER] 開始"
);

const employeeInput =
    getElement("employeeNo");

const button =
    getElement("startButton");

const message =
    getElement("message");

if (!employeeInput) {

    console.error(
        "[REGISTER] 找不到 employeeNo"
    );

    return;

}

const employeeNo =
    employeeInput.value.trim();

// ==========================================
// 工號檢查
// ==========================================

if (!employeeNo) {

    setMessage(
        "請先輸入員工工號"
    );

    employeeInput.focus();

    return;

}

// ==========================================
// LINE Token 檢查
// ==========================================

if (!currentIdToken) {

    setMessage(
        "LINE 尚未完成登入，請重新開啟頁面"
    );

    return;

}

// ==========================================
// LINE User ID 檢查
// ==========================================

if (!currentLineUserId) {

    setMessage(
        "無法取得 LINE 使用者 ID，請重新開啟 LINE"
    );

    return;

}

if (button) {

    button.disabled = true;

    button.innerText =
        "登入中...";

}

if (message) {

    message.innerHTML =

        `<span class="warning">
            ⏳ 正在驗證工號，請稍候...
        </span>`;

}

try {

    console.log(
        "[REGISTER] API:",
        `${API_BASE}/api/auth/register`
    );

    const response =
        await fetch(
            `${API_BASE}/api/auth/register`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        idToken:
                            currentIdToken,

                        employeeNo:
                            employeeNo

                    })
            }
        );

    console.log(
        "[REGISTER] HTTP:",
        response.status
    );

    const result =
        await readJson(response);

    console.log(
        "[REGISTER] result:",
        result
    );

    if (!response.ok) {

        throw new Error(
            result.message ||
            `登入失敗（HTTP ${response.status}）`
        );

    }

    if (result.success !== true) {

        throw new Error(
            result.message ||
            "工號註冊失敗"
        );

    }

    // ==========================================
    // 儲存資料
    // ==========================================

    currentEmployeeNo =
        result.employeeNo ||
        employeeNo;

    currentLineUserId =
        result.lineUserId ||
        currentLineUserId;

    currentDisplayName =
        result.displayName ||
        currentDisplayName;

    saveSession();

    // ==========================================
    // 如果有 QR Code
    // ==========================================

    if (
        currentMissionCode &&
        !currentMissionToken
    ) {

        showErrorPage(
            "QR Code 缺少關卡驗證碼"
        );

        return;

    }

    if (
        currentMissionCode &&
        currentMissionToken
    ) {

        await completeMission(
            currentMissionCode,
            currentMissionToken
        );

        return;

    }

    // ==========================================
    // 一般登入
    // ==========================================

    await loadProgress();

}
catch (error) {

    console.error(
        "[REGISTER] 錯誤:",
        error
    );

    if (message) {

        message.innerHTML =

            `<span class="error">
                ❌
                ${escapeHtml(
                    error.message ||
                    "登入失敗"
                )}
            </span>`;

    }

    if (button) {

        button.disabled =
            false;

        button.innerText =
            "🚀 開始闖關";

    }

}

}

// ==================================================
// 查詢闖關進度
// ==================================================

async function loadProgress() {

restoreSession();

if (
    !currentLineUserId ||
    !currentEmployeeNo
) {

    throw new Error(
        "尚未完成 LINE 登入與工號登記"
    );

}

console.log(
    "[PROGRESS] 查詢:",
    currentLineUserId,
    currentEmployeeNo
);

const url =
    `${API_BASE}/api/game/progress` +

    `?lineUserId=${encodeURIComponent(
        currentLineUserId
    )}` +

    `&employeeNo=${encodeURIComponent(
        currentEmployeeNo
    )}`;

const response =
    await fetch(
        url,
        {
            method: "GET",

            headers: {
                "Accept":
                    "application/json"
            }
        }
    );

console.log(
    "[PROGRESS] HTTP:",
    response.status
);

const result =
    await readJson(response);

if (!response.ok) {

    throw new Error(
        result.message ||
        `無法取得闖關進度（HTTP ${response.status}）`
    );

}

if (result.success !== true) {

    throw new Error(
        result.message ||
        "無法取得闖關進度"
    );

}

showMissionBoard(
    result
);

return result;

}

// ==================================================
// 關卡首頁
// ==================================================

function showMissionBoard(
progress
) {

const container =
    getElement("app");

const missions =
    progress.missions || [];

const completedCount =
    missions.filter(
        x => x.completed
    ).length;

const totalMissions =
    missions.length;

const allCompleted =
    progress.allCompleted === true ||
    (
        totalMissions > 0 &&
        completedCount === totalMissions
    );

const percentage =
    totalMissions === 0
        ? 0
        : Math.round(
            completedCount /
            totalMissions *
            100
        );

currentDisplayName =
    progress.participant?.displayName ||
    currentDisplayName;

currentEmployeeNo =
    progress.participant?.employeeNo ||
    currentEmployeeNo;

saveSession();

container.innerHTML = `

    <div class="logo">
        🎯
    </div>

    <h1>
        旺年會闖關
    </h1>

    <div class="subtitle">

        ${escapeHtml(
            currentDisplayName
        )}

        <br>

        工號：

        ${escapeHtml(
            currentEmployeeNo
        )}

    </div>

    <div class="progress-box">

        <strong>
            闖關進度
        </strong>

        <br>

        ${completedCount}
        /
        ${totalMissions}
        關

        <div class="progress-bar">

            <div
                class="progress-fill"
                style="width:${percentage}%"
            ></div>

        </div>

    </div>

    <div class="mission-list">

        ${
            missions.map(
                mission => {

                    const code =
                        mission.code;

                    const missionInfo =
                        MISSIONS[code];

                    const missionName =
                        missionInfo
                            ? missionInfo.name
                            : (
                                mission.name ||
                                code
                            );

                    return `

                        <div
                            class="
                                mission-row
                                ${
                                    mission.completed
                                        ? "done"
                                        : ""
                                }
                            "
                        >

                            ${
                                mission.completed
                                    ? "✅"
                                    : "⬜"
                            }

                            <span class="mission-code">

                                ${escapeHtml(
                                    code
                                )}

                            </span>

                            <span class="mission-name">

                                ${escapeHtml(
                                    missionName
                                )}

                            </span>

                            <br>

                            <span class="small">

                                ${
                                    mission.completed
                                        ? "已完成"
                                        : "尚未完成，請掃描現場 QR Code"
                                }

                            </span>

                        </div>

                    `;

                }
            ).join("")
        }

    </div>

    ${
        allCompleted
            ? `

                <div class="lottery">

                    🎊

                    <br>

                    <strong>
                        六關全部完成！
                    </strong>

                    <br><br>

                    已完成全部闖關，
                    可以送出抽獎資料。

                </div>

                ${
                    progress.lotterySubmitted
                        ? `

                            <button
                                type="button"
                                onclick="showLotterySuccess()"
                            >
                                🎟️ 查看抽獎資格
                            </button>

                        `
                        : `

                            <button
                                type="button"
                                onclick="showLotterySubmit()"
                            >
                                🎟️ 送出抽獎資料
                            </button>

                        `
                }

            `
            : `

                <div class="qr-info">

                    📱

                    <br>

                    請到現場完成各項遊戲。

                    <br>

                    每完成一關，

                    <br>

                    掃描該關 QR Code
                    記錄闖關進度。

                </div>

            `
    }

    <div
        id="message"
        class="message"
    ></div>

`;

}

// ==================================================
// 顯示 QR Code 等待輸入工號
// ==================================================

function showMissionQRWaiting(
missionCode
) {

const container =
    getElement("app");

const missionName =
    MISSIONS[missionCode]
        ? MISSIONS[missionCode].name
        : missionCode;

container.innerHTML = `

    <div class="logo">
        🎯
    </div>

    <h1>
        ${escapeHtml(
            missionName
        )}
    </h1>

    <div class="qr-info">

        已掃描：

        <strong>
            ${escapeHtml(
                missionCode
            )}
        </strong>

        <br><br>

        請先輸入員工工號。

    </div>

    <input
        type="text"
        id="employeeNo"
        placeholder="請輸入員工工號"
        autocomplete="off"
        maxlength="50"
    >

    <button
        type="button"
        id="startButton"
        onclick="registerAndStart()"
    >
        🚀 登入並完成此關
    </button>

    <div
        id="message"
        class="message"
    ></div>

`;

restoreSession();

}

// ==================================================
// 完成關卡
// ==================================================

async function completeMission(
missionCode,
missionToken
) {

restoreSession();

if (
    !currentLineUserId ||
    !currentEmployeeNo
) {

    showMissionQRWaiting(
        missionCode
    );

    return;

}

if (!missionToken) {

    showErrorPage(
        "QR Code 缺少關卡驗證碼"
    );

    return;

}

const missionInfo =
    MISSIONS[missionCode];

const missionName =
    missionInfo
        ? missionInfo.name
        : missionCode;

const container =
    getElement("app");

container.innerHTML = `

    <div class="logo">
        🎯
    </div>

    <h1>
        ${escapeHtml(
            missionName
        )}
    </h1>

    <div class="loading">

        正在驗證闖關資料...

        <br><br>

        ⏳ 請稍候

    </div>

`;

try {

    console.log(
        "[MISSION] 完成:",
        missionCode
    );

    const response =
        await fetch(
            `${API_BASE}/api/game/complete-mission`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        lineUserId:
                            currentLineUserId,

                        employeeNo:
                            currentEmployeeNo,

                        missionCode:
                            missionCode,

                        missionToken:
                            missionToken

                    })
            }
        );

    console.log(
        "[MISSION] HTTP:",
        response.status
    );

    const result =
        await readJson(response);

    console.log(
        "[MISSION] result:",
        result
    );

    if (!response.ok) {

        throw new Error(
            result.message ||
            `關卡驗證失敗（HTTP ${response.status}）`
        );

    }

    if (result.success !== true) {

        throw new Error(
            result.message ||
            "關卡驗證失敗"
        );

    }

    showMissionSuccess(
        result,
        missionName
    );

    // ==========================================
    // 清除 QR URL
    // ==========================================

    try {

        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

    }
    catch (e) {

        console.log(
            e
        );

    }

}
catch (error) {

    console.error(
        "[MISSION] 錯誤:",
        error
    );

    showErrorPage(
        error.message ||
        "關卡驗證失敗"
    );

}

}

// ==================================================
// 送出抽獎資料
// ==================================================

async function submitLottery(
button
) {

if (!button) {

    button =
        getElement(
            "lotteryButton"
        );

}

if (button) {

    button.disabled =
        true;

    button.innerText =
        "資料上傳中...";

}

try {

    restoreSession();

    if (
        !currentLineUserId ||
        !currentEmployeeNo
    ) {

        throw new Error(
            "登入資料遺失，請重新登入"
        );

    }

    const response =
        await fetch(
            `${API_BASE}/api/game/submit-lottery`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        lineUserId:
                            currentLineUserId,

                        employeeNo:
                            currentEmployeeNo

                    })
            }
        );

    const result =
        await readJson(response);

    if (!response.ok) {

        throw new Error(
            result.message ||
            `抽獎資料上傳失敗（HTTP ${response.status}）`
        );

    }

    if (result.success !== true) {

        throw new Error(
            result.message ||
            "抽獎資料上傳失敗"
        );

    }

    showLotterySuccess();

}
catch (error) {

    console.error(
        "[LOTTERY] 錯誤:",
        error
    );

    if (button) {

        button.disabled =
            false;

        button.innerText =
            "🎟️ 確認送出抽獎資料";

    }

    showError(
        error.message ||
        "抽獎資料上傳失敗"
    );

}

}

// ==================================================
// HTML Escape
// ==================================================

function escapeHtml(
value
) {

if (value == null) {

    return "";

}

return String(value)

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}
