<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>旺年會闖關</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #fff4d6,
            #ffe4ec
        );

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    color: #333;
}


.container {

    width: 90%;

    max-width: 420px;

    background: white;

    border-radius: 24px;

    padding: 30px 22px;

    text-align: center;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.12);
}


.logo {

    font-size: 60px;

    margin-bottom: 8px;
}


h1 {

    color: #d9485f;

    margin: 10px 0;

    font-size: 26px;
}


h2 {

    font-size: 20px;

    line-height: 1.5;
}


.subtitle {

    color: #777;

    margin-bottom: 20px;

    line-height: 1.6;
}


.user {

    background: #f7f7f7;

    padding: 12px;

    border-radius: 12px;

    margin-bottom: 20px;
}


input {

    width: 100%;

    padding: 15px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 16px;

    margin-bottom: 15px;
}


button {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background: #06c755;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    margin-bottom: 10px;
}


button:active {

    transform: scale(0.97);
}


button:disabled {

    background: #aaa;

    cursor: not-allowed;
}


.secondary {

    background: #777;
}


.question-box {

    background: #f7f7f7;

    padding: 18px;

    border-radius: 15px;

    margin-bottom: 18px;
}


.question-number {

    color: #888;

    margin-bottom: 8px;
}


.message {

    min-height: 28px;

    margin-top: 12px;

    font-weight: bold;

    line-height: 1.5;
}


.success {

    color: #06a847;
}


.error {

    color: #d9485f;
}


.memory-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

    margin: 20px 0;
}


.memory-card {

    aspect-ratio: 1 / 1;

    padding: 0;

    margin: 0;

    background: #ff6b81;

    border-radius: 12px;

    font-size: 30px;

    display: flex;

    align-items: center;

    justify-content: center;
}


.memory-card.open {

    background: #fff4d6;

    color: #333;
}


.memory-card.matched {

    background: #06c755;
}


.find-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin: 20px 0;
}


.find-item {

    background: #f7f7f7;

    color: #333;

    font-size: 34px;

    min-height: 75px;

    display: flex;

    align-items: center;

    justify-content: center;

    border: 2px solid #eee;
}


.reaction-area {

    min-height: 220px;

    border-radius: 20px;

    background: #eee;

    display: flex;

    align-items: center;

    justify-content: center;

    margin: 20px 0;

    font-size: 36px;

    font-weight: bold;
}


.reaction-area.waiting {

    background: #ffe0e0;

    color: #d9485f;
}


.reaction-area.go {

    background: #c8ffd9;

    color: #06a847;
}


.mission-list {

    text-align: left;

    margin: 20px 0;
}


.mission-row {

    padding: 12px;

    margin-bottom: 8px;

    border-radius: 10px;

    background: #f7f7f7;
}


.mission-row.done {

    background: #d9ffe5;

    color: #07883e;

    font-weight: bold;
}


.lottery {

    background:
        linear-gradient(
            135deg,
            #fff4d6,
            #ffe1e8
        );

    padding: 20px;

    border-radius: 18px;

    margin: 20px 0;
}


.small {

    font-size: 14px;

    color: #888;
}

</style>

</head>


<body>

<div
    class="container"
    id="app"
>

    <div class="logo">
        🎉
    </div>

    <h1>
        旺年會闖關
    </h1>

    <div class="subtitle">
        歡迎參加今年的旺年會活動！
    </div>

    <div
        class="user"
        id="userInfo"
    >
        LINE 登入中...
    </div>

    <input
        type="text"
        id="employeeNo"
        placeholder="請輸入員工工號"
    >

    <button
        id="startButton"
        onclick="registerAndStart()"
        disabled
    >
        🚀 開始闖關
    </button>

    <div
        class="message"
        id="message"
    ></div>

</div>


<script>

// ==================================================
// 基本設定
// ==================================================

const LIFF_ID =
    "2011685953-o8qvyQfR";


// ⚠️ 改成你的正式 API 網址

const API_BASE =
    "https://localhost:7086";


// ==================================================
// 全域資料
// ==================================================

let currentIdToken = "";

let currentLineUserId = "";

let currentDisplayName = "";

let currentEmployeeNo = "";


// ==================================================
// 六關 Token
// ==================================================

const missionTokens = {

    M01:
        "8f4d9c7a2e6b1a5d9c3f7e8b2a6d4c91",

    M02:
        "b7e3a91c5d8f2a6e4c9b1d7f3e5a8c62",

    M03:
        "d2f8a6c1e9b4d7a3f5c8e2b6a1d9f473",

    M04:
        "a9c3e7f2b6d1a8c4e5f9b3d7a2c6e814",

    M05:
        "e6b2d9a4c7f1e8a3d5c9b6f2a7e4c831",

    M06:
        "c5a8e2d7f3b9c1a6e4d8f2b7c6a9e315"
};


// ==================================================
// LIFF 初始化
// ==================================================

async function initLIFF() {

    try {

        await liff.init({
            liffId: LIFF_ID
        });


        if (!liff.isLoggedIn()) {

            liff.login();

            return;
        }


        const idToken =
            liff.getIDToken();


        if (!idToken) {

            throw new Error(
                "無法取得 LINE ID Token"
            );
        }


        currentIdToken =
            idToken;


        const profile =
            await liff.getProfile();


        currentLineUserId =
            profile.userId;


        currentDisplayName =
            profile.displayName;


        sessionStorage.setItem(
            "lineDisplayName",
            profile.displayName
        );


        sessionStorage.setItem(
            "lineUserId",
            profile.userId
        );


        document.getElementById(
            "userInfo"
        ).innerHTML =

            "你好，<strong>" +
            escapeHtml(
                profile.displayName
            ) +
            "</strong> 👋<br>" +

            `<span class="small">
                LINE 登入成功
            </span>`;


        document.getElementById(
            "startButton"
        ).disabled = false;


        // 嘗試恢復工號

        const savedEmployeeNo =
            sessionStorage.getItem(
                "employeeNo"
            );


        if (savedEmployeeNo) {

            document.getElementById(
                "employeeNo"
            ).value =
                savedEmployeeNo;

        }

    }
    catch (error) {

        console.error(error);

        document.getElementById(
            "userInfo"
        ).innerHTML =

            `<span class="error">
                LINE 登入失敗
                <br>
                ${escapeHtml(
                    error.message
                )}
            </span>`;
    }
}


// ==================================================
// LINE + 工號註冊
// ==================================================

async function registerAndStart() {

    const employeeNo =
        document
            .getElementById(
                "employeeNo"
            )
            .value
            .trim();


    const message =
        document.getElementById(
            "message"
        );


    if (!employeeNo) {

        message.innerHTML =

            `<span class="error">
                請先輸入員工工號
            </span>`;

        return;
    }


    if (!currentIdToken) {

        message.innerHTML =

            `<span class="error">
                LINE 尚未完成登入
            </span>`;

        return;
    }


    const button =
        document.getElementById(
            "startButton"
        );


    button.disabled = true;

    button.innerText =
        "登入中...";


    try {

        const response =
            await fetch(
                `${API_BASE}/api/auth/register`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            idToken:
                                currentIdToken,

                            employeeNo:
                                employeeNo

                        })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "登入失敗"
            );
        }


        currentEmployeeNo =
            result.employeeNo;


        currentLineUserId =
            result.lineUserId;


        currentDisplayName =
            result.displayName;


        sessionStorage.setItem(
            "employeeNo",
            result.employeeNo
        );


        sessionStorage.setItem(
            "lineUserId",
            result.lineUserId
        );


        sessionStorage.setItem(
            "lineDisplayName",
            result.displayName || ""
        );


        await loadProgress();

    }
    catch (error) {

        console.error(error);


        message.innerHTML =

            `<span class="error">
                ${escapeHtml(
                    error.message
                )}
            </span>`;


        button.disabled = false;

        button.innerText =
            "🚀 開始闖關";
    }
}


// ==================================================
// 查詢進度
// ==================================================

async function loadProgress() {

    currentLineUserId =
        sessionStorage.getItem(
            "lineUserId"
        );


    currentEmployeeNo =
        sessionStorage.getItem(
            "employeeNo"
        );


    const response =
        await fetch(
            `${API_BASE}/api/game/progress` +

            `?lineUserId=${encodeURIComponent(
                currentLineUserId
            )}` +

            `&employeeNo=${encodeURIComponent(
                currentEmployeeNo
            )}`
        );


    const result =
        await response.json();


    if (!response.ok) {

        throw new Error(
            result.message ||
            "無法取得闖關進度"
        );
    }


    showMissionBoard(
        result
    );
}


// ==================================================
// 關卡首頁
// ==================================================

function showMissionBoard(
    progress
) {

    const container =
        document.getElementById(
            "app"
        );


    container.innerHTML = `

        <div class="logo">
            🎯
        </div>

        <h1>
            旺年會闖關
        </h1>

        <div class="subtitle">

            ${escapeHtml(
                progress.participant.displayName ||
                ""
            )}

            <br>

            工號：
            ${escapeHtml(
                progress.participant.employeeNo
            )}

        </div>


        <div class="mission-list">

            ${progress.missions.map(
                mission => `

                    <div
                        class="
                            mission-row
                            ${
                                mission.completed
                                    ? "done"
                                    : ""
                            }
                        "
                    >

                        ${
                            mission.completed
                                ? "✅"
                                : "⬜"
                        }

                        ${mission.code}

                        ${
                            mission.completed
                                ? " 已完成"
                                : " 尚未完成"
                        }

                    </div>

                `
            ).join("")}

        </div>


        <p>

            已完成：

            <strong>
                ${progress.completedCount}
                /
                ${progress.totalMissions}
            </strong>

        </p>


        ${
            progress.allCompleted
                ? `

                    <button
                        onclick="
                            showLotterySubmit()
                        "
                    >
                        🎟️ 送出抽獎資料
                    </button>

                `
                : `

                    <p class="small">

                        請掃描現場各關卡
                        QR Code 完成闖關。

                    </p>

                `
        }


        <div
            id="message"
            class="message"
        ></div>

    `;
}


// ==================================================
// 完成關卡
// ==================================================

async function completeMission(
    missionCode
) {

    try {

        const lineUserId =
            sessionStorage.getItem(
                "lineUserId"
            );


        const employeeNo =
            sessionStorage.getItem(
                "employeeNo"
            );


        const response =
            await fetch(
                `${API_BASE}/api/game/complete-mission`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            lineUserId:
                                lineUserId,

                            employeeNo:
                                employeeNo,

                            missionCode:
                                missionCode,

                            missionToken:
                                missionTokens[
                                    missionCode
                                ]

                        })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "關卡驗證失敗"
            );
        }


        showMissionSuccess(
            result
        );

    }
    catch (error) {

        showError(
            error.message
        );
    }
}


// ==================================================
// 關卡完成畫面
// ==================================================

function showMissionSuccess(
    result
) {

    const container =
        document.getElementById(
            "app"
        );


    container.innerHTML = `

        <div class="logo">
            🎉
        </div>

        <h1>
            闖關成功！
        </h1>

        <div class="lottery">

            <strong>
                ${result.missionCode}
            </strong>

            <br><br>

            ${
                result.message
            }

            <br><br>

            已完成：

            <strong>
                ${result.completedCount}
                /
                ${result.totalMissions}
            </strong>

        </div>


        <button
            onclick="loadProgress()"
        >
            ▶️ 查看闖關進度
        </button>

    `;
}


// ==================================================
// 抽獎送出確認
// ==================================================

function showLotterySubmit() {

    const container =
        document.getElementById(
            "app"
        );


    container.innerHTML = `

        <div class="logo">
            🏆
        </div>

        <h1>
            六關全部完成！
        </h1>

        <div class="lottery">

            🎊 恭喜完成全部六關！

            <br><br>

            姓名：

            <strong>
                ${escapeHtml(
                    currentDisplayName
                )}
            </strong>

            <br>

            工號：

            <strong>
                ${escapeHtml(
                    currentEmployeeNo
                )}
            </strong>

            <br><br>

            確認要送出抽獎資料嗎？

        </div>


        <button
            onclick="submitLottery()"
        >
            🎟️ 確認送出抽獎資料
        </button>


        <button
            class="secondary"
            onclick="loadProgress()"
        >
            返回
        </button>


        <div
            id="message"
            class="message"
        ></div>

    `;
}


// ==================================================
// 送出抽獎
// ==================================================

async function submitLottery() {

    const button =
        event.target;


    button.disabled = true;

    button.innerText =
        "資料上傳中...";


    try {

        const lineUserId =
            sessionStorage.getItem(
                "lineUserId"
            );


        const employeeNo =
            sessionStorage.getItem(
                "employeeNo"
            );


        const response =
            await fetch(
                `${API_BASE}/api/game/submit-lottery`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            lineUserId:
                                lineUserId,

                            employeeNo:
                                employeeNo

                        })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "抽獎資料上傳失敗"
            );
        }


        showLotterySuccess();

    }
    catch (error) {

        button.disabled = false;

        button.innerText =
            "🎟️ 確認送出抽獎資料";


        showError(
            error.message
        );
    }
}


// ==================================================
// 抽獎成功
// ==================================================

function showLotterySuccess() {

    const container =
        document.getElementById(
            "app"
        );


    container.innerHTML = `

        <div class="logo">
            🎊
        </div>

        <h1>
            資料已上傳！
        </h1>


        <div class="lottery">

            <div style="font-size:45px;">
                🎟️
            </div>

            <h2>
                已取得抽獎資格
            </h2>

            <p>

                姓名：

                <strong>
                    ${escapeHtml(
                        currentDisplayName
                    )}
                </strong>

            </p>


            <p>

                工號：

                <strong>
                    ${escapeHtml(
                        currentEmployeeNo
                    )}
                </strong>

            </p>


            <p class="success">

                ✅ 六關完成

                <br>

                ✅ 抽獎資料已上傳

                <br>

                ✅ 已取得抽獎資格

            </p>

        </div>


        <p class="small">

            請依現場工作人員指示
            進行後續抽獎。

        </p>

    `;
}


// ==================================================
// 錯誤
// ==================================================

function showError(
    message
) {

    const element =
        document.getElementById(
            "message"
        );


    if (!element) {

        alert(message);

        return;
    }


    element.innerHTML =

        `<span class="error">
            ❌
            ${escapeHtml(
                message
            )}
        </span>`;
}


// ==================================================
// HTML Escape
// ==================================================

function escapeHtml(
    value
) {

    if (value == null) {

        return "";
    }


    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


// ==================================================
// 啟動
// ==================================================

initLIFF();

</script>

</body>

</html>
