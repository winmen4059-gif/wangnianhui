<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>旺年會闖關</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        Arial,
        sans-serif;

      background: linear-gradient(
        135deg,
        #fff4d6,
        #ffe4ec
      );

      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .logo {
      font-size: 64px;
      margin-bottom: 10px;
    }

    h1 {
      color: #d9485f;
      margin: 10px 0;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .user {
      background: #f7f7f7;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #06c755;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .loading {
      color: #888;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🎉</div>

    <h1>旺年會闖關</h1>

    <div class="subtitle">
      歡迎參加今年的旺年會活動！
    </div>

    <div class="user" id="userInfo">
      LINE 登入中...
    </div>

    <input
      type="text"
      id="employeeNo"
      placeholder="請輸入員工工號"
    >

    <button onclick="startGame()">
      🚀 開始闖關
    </button>

    <div class="loading" id="message"></div>

  </div>

  <script>

    const LIFF_ID = "2011685953-o8qvyQfR";

    async function initLIFF() {

      try {

        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {

          liff.login();

          return;
        }

        const profile = await liff.getProfile();

        document.getElementById("userInfo").innerHTML =
          "你好，<strong>" +
          profile.displayName +
          "</strong> 👋";

      } catch (error) {

        console.error(error);

        document.getElementById("userInfo").innerText =
          "LINE 登入失敗";

      }
    }


    function startGame() {

  const employeeNo =
    document.getElementById("employeeNo").value.trim();

  const message =
    document.getElementById("message");

  // 沒有輸入工號
  if (!employeeNo) {

    message.innerText =
      "請先輸入員工工號";

    return;
  }

  // 暫時記住工號
  sessionStorage.setItem(
    "employeeNo",
    employeeNo
  );

  // 進入第 1 關
  showMission(1);
}


function showMission(missionNumber) {

  const container =
    document.querySelector(".container");

  container.innerHTML = `

    <div class="logo">🎯</div>

    <h1>第 ${missionNumber} 關</h1>

    <div class="subtitle">
      準備開始第 ${missionNumber} 關！
    </div>

    <div class="user">
      工號：
      ${sessionStorage.getItem("employeeNo")}
    </div>

    <p>
      這裡之後會放第 ${missionNumber} 關的遊戲內容。
    </p>

    <button onclick="completeMission(${missionNumber})">
      ✅ 完成第 ${missionNumber} 關
    </button>

  `;
}


function completeMission(missionNumber) {

  if (missionNumber === 1) {
    startMission1();
    return;
  }

  if (missionNumber < 6) {
    showMission(missionNumber + 1);
    return;
  }

  showCompleted();
}

function startMission1() {

  const container =
    document.querySelector(".container");

  container.innerHTML = `

    <div class="logo">🎯</div>

    <h1>第 1 關｜旺年會知識王</h1>

    <div class="subtitle">
      3 題答對 2 題即可過關
    </div>

    <div id="questionArea"></div>

  `;

  showQuestion1();
}


let question1Index = 0;
let question1Correct = 0;


const mission1Questions = [

  {
    question: "公司的旺年會最重要的是什麼？",
    options: [
      "一起同樂",
      "一直工作",
      "提早下班"
    ],
    answer: 0
  },

  {
    question: "參加闖關活動時，最重要的是？",
    options: [
      "遵守活動規則",
      "直接跳關",
      "幫別人代答"
    ],
    answer: 0
  },

  {
    question: "完成 6 關之後，可以取得什麼？",
    options: [
      "抽獎資格",
      "公司股票",
      "一個月假期"
    ],
    answer: 0
  }

];


function showQuestion1() {

  const q =
    mission1Questions[question1Index];

  const area =
    document.getElementById("questionArea");

  area.innerHTML = `

    <div style="
      background:#f7f7f7;
      padding:20px;
      border-radius:15px;
      margin-bottom:20px;
    ">

      <div style="
        color:#888;
        margin-bottom:10px;
      ">
        第 ${question1Index + 1} / 3 題
      </div>

      <h2>${q.question}</h2>

    </div>

    ${q.options.map((option, index) => `

      <button
        onclick="answerQuestion1(${index})"
        style="
          margin-bottom:12px;
          background:#06c755;
        "
      >
        ${option}
      </button>

    `).join("")}

    <div id="answerMessage"
         style="margin-top:15px;">
    </div>

  `;
}


function answerQuestion1(selected) {

  const q =
    mission1Questions[question1Index];

  const message =
    document.getElementById("answerMessage");

  if (selected === q.answer) {

    question1Correct++;

    message.innerHTML =
      "✅ 答對了！";

  } else {

    message.innerHTML =
      "❌ 答錯了！";

  }

  setTimeout(() => {

    question1Index++;

    if (question1Index >= 3) {

      finishMission1();

    } else {

      showQuestion1();

    }

  }, 700);
}


function finishMission1() {

  const container =
    document.querySelector(".container");

  if (question1Correct >= 2) {

    container.innerHTML = `

      <div class="logo">🎉</div>

      <h1>第 1 關完成！</h1>

      <p>
        答對 ${question1Correct} / 3 題
      </p>

      <button onclick="showMission(2)">
        ▶️ 前往第 2 關
      </button>

    `;

  } else {

    question1Index = 0;
    question1Correct = 0;

    container.innerHTML = `

      <div class="logo">💪</div>

      <h1>再試一次！</h1>

      <p>
        需要答對 2 題才能過關。
      </p>

      <button onclick="startMission1()">
        🔄 重新挑戰
      </button>

    `;

  }

}


function showCompleted() {

  const container =
    document.querySelector(".container");

  container.innerHTML = `

    <div class="logo">🎊</div>

    <h1>恭喜完成！</h1>

    <div class="subtitle">
      你已完成全部 6 關闖關！
    </div>

    <div class="user">
      🎉 恭喜取得抽獎資格！
    </div>

  `;
}


    initLIFF();

  </script>

</body>
</html>
