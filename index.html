<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>旺年會闖關</title>

    <!-- LINE LIFF -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans TC",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff4d6,
                    #ffe4ec
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            color: #333;

            padding: 20px;
        }


        .container {

            width: 100%;

            max-width: 430px;

            background: white;

            border-radius: 24px;

            padding: 30px 22px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.12);
        }


        .logo {

            font-size: 60px;

            margin-bottom: 8px;
        }


        h1 {

            color: #d9485f;

            margin: 10px 0;

            font-size: 27px;
        }


        h2 {

            font-size: 20px;

            line-height: 1.5;
        }


        .subtitle {

            color: #777;

            margin-bottom: 20px;

            line-height: 1.6;
        }


        .user {

            background: #f7f7f7;

            padding: 12px;

            border-radius: 12px;

            margin-bottom: 20px;

            line-height: 1.6;
        }


        input {

            width: 100%;

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            margin-bottom: 15px;

            outline: none;
        }


        input:focus {

            border-color: #06c755;

            box-shadow:
                0 0 0 3px
                rgba(6,199,85,0.12);
        }


        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #06c755;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-bottom: 10px;
        }


        button:active {

            transform: scale(0.97);
        }


        button:disabled {

            background: #aaa;

            cursor: not-allowed;
        }


        .secondary {

            background: #777;
        }


        .mission-list {

            text-align: left;

            margin: 20px 0;
        }


        .mission-row {

            padding: 14px;

            margin-bottom: 9px;

            border-radius: 12px;

            background: #f7f7f7;

            line-height: 1.5;
        }


        .mission-row.done {

            background: #d9ffe5;

            color: #07883e;

            font-weight: bold;
        }


        .mission-row.current {

            border: 2px solid #ffd166;

            background: #fff9e6;
        }


        .mission-code {

            font-size: 13px;

            color: #999;

            margin-right: 5px;
        }


        .mission-name {

            font-size: 17px;
        }


        .message {

            min-height: 28px;

            margin-top: 12px;

            font-weight: bold;

            line-height: 1.5;
        }


        .success {

            color: #06a847;
        }


        .error {

            color: #d9485f;
        }


        .warning {

            color: #d88900;
        }


        .lottery {

            background:
                linear-gradient(
                    135deg,
                    #fff4d6,
                    #ffe1e8
                );

            padding: 20px;

            border-radius: 18px;

            margin: 20px 0;

            line-height: 1.8;
        }


        .lottery-icon {

            font-size: 55px;

            margin-bottom: 5px;
        }


        .progress-box {

            background: #f7f7f7;

            border-radius: 15px;

            padding: 15px;

            margin: 20px 0;
        }


        .progress-bar {

            width: 100%;

            height: 14px;

            background: #eee;

            border-radius: 20px;

            overflow: hidden;

            margin-top: 10px;
        }


        .progress-fill {

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #06c755,
                    #00a8ff
                );

            border-radius: 20px;

            transition: width 0.4s ease;
        }


        .small {

            font-size: 14px;

            color: #888;

            line-height: 1.6;
        }


        .qr-info {

            background: #fff9e6;

            border: 1px solid #ffe08a;

            padding: 15px;

            border-radius: 15px;

            margin: 20px 0;

            line-height: 1.7;
        }


        .loading {

            padding: 20px 0;

            color: #777;
        }

    </style>

</head>


<body>

<div
    class="container"
    id="app"
>

    <div class="logo">
        🎉
    </div>

    <h1>
        旺年會闖關
    </h1>

    <div class="subtitle">
        歡迎參加今年的旺年會活動！
    </div>

    <div
        class="user"
        id="userInfo"
    >
        LINE 登入中...
    </div>

    <input
        type="text"
        id="employeeNo"
        placeholder="請輸入員工工號"
        autocomplete="off"
    >

    <button
        id="startButton"
        onclick="registerAndStart()"
        disabled
    >
        🚀 開始闖關
    </button>

    <div
        class="message"
        id="message"
    ></div>

</div>


<script>


// ==================================================
// 基本設定
// ==================================================

const LIFF_ID =
    "2011685953-o8qvyQfR";


// ==================================================
// ⚠️ 非常重要
//
// 這裡必須改成你的 ASP.NET Core API 公開網址
//
// 例如：
// https://api.xxxxx.com
//
// 如果你目前 Visual Studio 本機測試：
// https://localhost:7086
//
// 正式 GitHub Pages 上線時不能使用 localhost。
// ==================================================

const API_BASE =
    "https://newsapi.winmen.com.tw";


// ==================================================
// 六個關卡
// ==================================================

const MISSIONS = {

    M01: {
        name: "飛鏢機"
    },

    M02: {
        name: "酒館推推樂"
    },

    M03: {
        name: "沙漠酒桶投擲"
    },

    M04: {
        name: "水彈射擊"
    },

    M05: {
        name: "套圈圈"
    },

    M06: {
        name: "牛仔腰力王"
    }

};


// ==================================================
// 全域資料
// ==================================================

let currentIdToken = "";

let currentLineUserId = "";

let currentDisplayName = "";

let currentEmployeeNo = "";


// ==================================================
// 工號、LINE 資料
// ==================================================

function restoreSession() {

    currentLineUserId =
        sessionStorage.getItem(
            "lineUserId"
        ) || "";

    currentDisplayName =
        sessionStorage.getItem(
            "lineDisplayName"
        ) || "";

    currentEmployeeNo =
        sessionStorage.getItem(
            "employeeNo"
        ) || "";


    const employeeInput =
        document.getElementById(
            "employeeNo"
        );


    if (
        employeeInput &&
        currentEmployeeNo
    ) {

        employeeInput.value =
            currentEmployeeNo;
    }

}


// ==================================================
// LIFF 初始化
// ==================================================

async function initLIFF() {

    try {

        await liff.init({
            liffId: LIFF_ID
        });


        if (!liff.isLoggedIn()) {

            liff.login();

            return;
        }


        // ==========================================
        // 取得 LINE ID Token
        // ==========================================

        const idToken =
            liff.getIDToken();


        if (!idToken) {

            throw new Error(
                "無法取得 LINE ID Token"
            );
        }


        currentIdToken =
            idToken;


        // ==========================================
        // 取得 LINE Profile
        // ==========================================

        const profile =
            await liff.getProfile();


        currentLineUserId =
            profile.userId;

        currentDisplayName =
            profile.displayName;


        sessionStorage.setItem(
            "lineUserId",
            profile.userId
        );


        sessionStorage.setItem(
            "lineDisplayName",
            profile.displayName
        );


        document.getElementById(
            "userInfo"
        ).innerHTML =

            "你好，<strong>" +
            escapeHtml(
                profile.displayName
            ) +
            "</strong> 👋<br>" +

            `<span class="small">
                LINE 登入成功
            </span>`;


        document.getElementById(
            "startButton"
        ).disabled = false;


        restoreSession();


        // ==========================================
        // 如果已經有工號
        // 嘗試直接載入進度
        // ==========================================

        if (currentEmployeeNo) {

            try {

                await loadProgress();

                return;

            }
            catch (error) {

                console.log(
                    "尚未完成註冊，等待使用者輸入工號"
                );

            }

        }


        // ==========================================
        // 檢查是不是從關卡 QR Code 進來
        // ==========================================

        await checkMissionQRCode();

    }
    catch (error) {

        console.error(error);


        document.getElementById(
            "userInfo"
        ).innerHTML =

            `<span class="error">
                LINE 登入失敗
                <br>
                ${escapeHtml(
                    error.message
                )}
            </span>`;
    }

}


// ==================================================
// LINE + 工號註冊
// ==================================================

async function registerAndStart() {

    const employeeNo =
        document
            .getElementById(
                "employeeNo"
            )
            .value
            .trim();


    const message =
        document.getElementById(
            "message"
        );


    if (!employeeNo) {

        message.innerHTML =

            `<span class="error">
                請先輸入員工工號
            </span>`;

        return;
    }


    if (!currentIdToken) {

        message.innerHTML =

            `<span class="error">
                LINE 尚未完成登入
            </span>`;

        return;
    }


    const button =
        document.getElementById(
            "startButton"
        );


    button.disabled = true;

    button.innerText =
        "登入中...";


    try {

        const response =
            await fetch(
                `${API_BASE}/api/auth/register`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            idToken:
                                currentIdToken,

                            employeeNo:
                                employeeNo

                        })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "登入失敗"
            );
        }


        currentEmployeeNo =
            result.employeeNo;

        currentLineUserId =
            result.lineUserId;

        currentDisplayName =
            result.displayName;


        sessionStorage.setItem(
            "employeeNo",
            result.employeeNo
        );


        sessionStorage.setItem(
            "lineUserId",
            result.lineUserId
        );


        sessionStorage.setItem(
            "lineDisplayName",
            result.displayName || ""
        );


        // ==========================================
        // 註冊成功後查詢進度
        // ==========================================

        await loadProgress();


        // ==========================================
        // 如果是從關卡 QR Code 進來
        // 自動完成該關
        // ==========================================

        await checkMissionQRCode();

    }
    catch (error) {

        console.error(error);


        message.innerHTML =

            `<span class="error">
                ❌
                ${escapeHtml(
                    error.message
                )}
            </span>`;


        button.disabled = false;

        button.innerText =
            "🚀 開始闖關";
    }

}


// ==================================================
// 查詢闖關進度
// ==================================================

async function loadProgress() {

    restoreSession();


    if (
        !currentLineUserId ||
        !currentEmployeeNo
    ) {

        throw new Error(
            "尚未完成 LINE 登入與工號登記"
        );

    }


    const response =
        await fetch(
            `${API_BASE}/api/game/progress` +

            `?lineUserId=${encodeURIComponent(
                currentLineUserId
            )}` +

            `&employeeNo=${encodeURIComponent(
                currentEmployeeNo
            )}`
        );


    const result =
        await response.json();


    if (!response.ok) {

        throw new Error(
            result.message ||
            "無法取得闖關進度"
        );
    }


    showMissionBoard(
        result
    );


    return result;
}


// ==================================================
// 關卡首頁
// ==================================================

function showMissionBoard(
    progress
) {

    const container =
        document.getElementById(
            "app"
        );


    const missions =
        progress.missions || [];


    const completedCount =
        missions.filter(
            x => x.completed
        ).length;


    const totalMissions =
        missions.length;


    const allCompleted =
        progress.allCompleted ||
        (
            totalMissions > 0 &&
            completedCount === totalMissions
        );


    const percentage =
        totalMissions === 0
            ? 0
            : Math.round(
                completedCount /
                totalMissions *
                100
            );


    container.innerHTML = `

        <div class="logo">
            🎯
        </div>

        <h1>
            旺年會闖關
        </h1>

        <div class="subtitle">

            ${escapeHtml(
                progress.participant.displayName ||
                currentDisplayName ||
                ""
            )}

            <br>

            工號：

            ${escapeHtml(
                progress.participant.employeeNo
            )}

        </div>


        <div class="progress-box">

            <strong>
                闖關進度
            </strong>

            <br>

            ${completedCount}
            /
            ${totalMissions}
            關

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    style="width:${percentage}%"
                ></div>

            </div>

        </div>


        <div class="mission-list">

            ${missions.map(
                mission => {

                    const code =
                        mission.code;

                    const missionInfo =
                        MISSIONS[code];

                    const missionName =
                        missionInfo
                            ? missionInfo.name
                            : code;

                    return `

                        <div
                            class="
                                mission-row
                                ${
                                    mission.completed
                                        ? "done"
                                        : ""
                                }
                            "
                        >

                            ${
                                mission.completed
                                    ? "✅"
                                    : "⬜"
                            }

                            <span class="mission-code">
                                ${escapeHtml(
                                    code
                                )}
                            </span>

                            <span class="mission-name">
                                ${escapeHtml(
                                    missionName
                                )}
                            </span>

                            <br>

                            <span class="small">

                                ${
                                    mission.completed
                                        ? "已完成"
                                        : "尚未完成，請掃描現場 QR Code"
                                }

                            </span>

                        </div>

                    `;

                }
            ).join("")}

        </div>


        ${
            allCompleted
                ? `

                    <div class="lottery">

                        🎊

                        <br>

                        <strong>
                            六關全部完成！
                        </strong>

                        <br><br>

                        已完成全部闖關，
                        可以送出抽獎資料。

                    </div>


                    ${
                        progress.lotterySubmitted
                            ? `

                                <button
                                    onclick="showLotterySuccess()"
                                >
                                    🎟️ 查看抽獎資格
                                </button>

                            `
                            : `

                                <button
                                    onclick="showLotterySubmit()"
                                >
                                    🎟️ 送出抽獎資料
                                </button>

                            `
                    }

                `
                : `

                    <div class="qr-info">

                        📱

                        <br>

                        請到現場完成各項遊戲。

                        <br>

                        每完成一關，

                        <br>

                        掃描該關 QR Code
                        記錄闖關進度。

                    </div>

                `
        }


        <div
            id="message"
            class="message"
        ></div>

    `;


    currentDisplayName =
        progress.participant.displayName ||
        currentDisplayName;

}


// ==================================================
// 檢查 QR Code
//
// QR Code URL 範例：
//
// https://liff.line.me/2011685953-o8qvyQfR
// ?mission=M01
// &token=xxxxxxxx
//
// ==================================================

async function checkMissionQRCode() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const missionCode =
        (
            params.get("mission") ||
            ""
        )
        .trim()
        .toUpperCase();


    const token =
        (
            params.get("token") ||
            ""
        ).trim();


    // 沒有關卡參數
    if (!missionCode) {

        return;

    }


    // ==========================================
    // 確認關卡
    // ==========================================

    if (!MISSIONS[missionCode]) {

        showError(
            "QR Code 的關卡代碼無效"
        );

        return;

    }


    // ==========================================
    // 尚未登入／沒有工號
    // ==========================================

    if (
        !currentLineUserId ||
        !currentEmployeeNo
    ) {

        showMissionQRWaiting(
            missionCode
        );

        return;

    }


    // ==========================================
    // QR Code 沒有 Token
    // ==========================================

    if (!token) {

        showError(
            "QR Code 缺少關卡驗證碼"
        );

        return;

    }


    await completeMission(
        missionCode,
        token
    );

}


// ==================================================
// QR Code 尚未完成登入
// ==================================================

function showMissionQRWaiting(
    missionCode
) {

    const container =
        document.getElementById(
            "app"
        );


    const missionName =
        MISSIONS[missionCode]
            ? MISSIONS[missionCode].name
            : missionCode;


    container.innerHTML = `

        <div class="logo">
            🎯
        </div>

        <h1>
            ${escapeHtml(
                missionName
            )}
        </h1>

        <div class="qr-info">

            已掃描：

            <strong>
                ${escapeHtml(
                    missionCode
                )}
            </strong>

            <br><br>

            請先輸入員工工號。

        </div>

        <input
            type="text"
            id="employeeNo"
            placeholder="請輸入員工工號"
            autocomplete="off"
        >

        <button
            onclick="registerAndStart()"
        >
            🚀 登入並完成此關
        </button>

        <div
            id="message"
            class="message"
        ></div>

    `;

}


// ==================================================
// 完成關卡
// ==================================================

async function completeMission(
    missionCode,
    missionToken
) {

    try {

        restoreSession();


        if (
            !currentLineUserId ||
            !currentEmployeeNo
        ) {

            throw new Error(
                "請先完成 LINE 登入與工號登記"
            );

        }


        const container =
            document.getElementById(
                "app"
            );


        const missionName =
            MISSIONS[missionCode]
                ? MISSIONS[missionCode].name
                : missionCode;


        container.innerHTML = `

            <div class="logo">
                🎯
            </div>

            <h1>
                ${escapeHtml(
                    missionName
                )}
            </h1>

            <div class="loading">

                正在驗證闖關資料...

                <br><br>

                ⏳ 請稍候

            </div>

        `;


        const response =
            await fetch(
                `${API_BASE}/api/game/complete-mission`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            lineUserId:
                                currentLineUserId,

                            employeeNo:
                                currentEmployeeNo,

                            missionCode:
                                missionCode,

                            missionToken:
                                missionToken

                        })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "關卡驗證失敗"
            );

        }


        showMissionSuccess(
            result,
            missionName
        );


        // ==========================================
        // 清掉 URL 上面的 QR Code 參數
        // 避免重新整理時重複處理
        // ==========================================

        try {

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

        }
        catch (e) {

            console.log(e);

        }

    }
    catch (error) {

        console.error(error);


        showErrorPage(
            error.message
        );

    }

}


// ==================================================
// 關卡完成畫面
// ==================================================

function showMissionSuccess(
    result,
    missionName
) {

    const container =
        document.getElementById(
            "app"
        );


    const completedCount =
        result.completedCount ||
        0;


    const totalMissions =
        result.totalMissions ||
        6;


    const allCompleted =
        result.allCompleted === true;


    container.innerHTML = `

        <div class="logo">
            🎉
        </div>

        <h1>
            闖關成功！
        </h1>


        <div class="lottery">

            <div
                style="
                    font-size:45px;
                "
            >
                ✅
            </div>

            <strong>
                ${escapeHtml(
                    missionName
                )}
            </strong>

            <br><br>

            ${escapeHtml(
                result.message ||
                "闖關成功"
            )}

            <br><br>

            已完成：

            <strong>
                ${completedCount}
                /
                ${totalMissions}
            </strong>

        </div>


        ${
            allCompleted
                ? `

                    <div class="lottery">

                        🎊

                        <br>

                        <strong>
                            六關全部完成！
                        </strong>

                        <br><br>

                        恭喜你！

                        <br>

                        現在可以送出抽獎資料。

                    </div>


                    <button
                        onclick="showLotterySubmit()"
                    >
                        🎟️ 送出抽獎資料
                    </button>

                `
                : `

                    <button
                        onclick="loadProgress()"
                    >
                        ▶️ 查看闖關進度
                    </button>

                `
        }

    `;

}


// ==================================================
// 抽獎送出確認
// ==================================================

function showLotterySubmit() {

    restoreSession();


    const container =
        document.getElementById(
            "app"
        );


    container.innerHTML = `

        <div class="logo">
            🏆
        </div>

        <h1>
            六關全部完成！
        </h1>


        <div class="lottery">

            <div class="lottery-icon">
                🎊
            </div>

            恭喜完成全部六關！

            <br><br>

            姓名：

            <strong>
                ${escapeHtml(
                    currentDisplayName
                )}
            </strong>

            <br>

            工號：

            <strong>
                ${escapeHtml(
                    currentEmployeeNo
                )}
            </strong>

            <br><br>

            <strong>
                確認要送出抽獎資料嗎？
            </strong>

        </div>


        <button
            id="lotteryButton"
            onclick="submitLottery(this)"
        >
            🎟️ 確認送出抽獎資料
        </button>


        <button
            class="secondary"
            onclick="loadProgress()"
        >
            返回
        </button>


        <div
            id="message"
            class="message"
        ></div>

    `;

}


// ==================================================
// 送出抽獎資料
// ==================================================

async function submitLottery(
    button
) {

    if (!button) {

        button =
            document.getElementById(
                "lotteryButton"
            );

    }


    if (button) {

        button.disabled = true;

        button.innerText =
            "資料上傳中...";

    }


    try {

        restoreSession();


        if (
            !currentLineUserId ||
            !currentEmployeeNo
        ) {

            throw new Error(
                "登入資料遺失，請重新登入"
            );

        }


        const response =
            await fetch(
                `${API_BASE}/api/game/submit-lottery`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            lineUserId:
                                currentLineUserId,

                            employeeNo:
                                currentEmployeeNo

                        })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "抽獎資料上傳失敗"
            );

        }


        // ==========================================
        // 上傳成功
        // ==========================================

        showLotterySuccess();

    }
    catch (error) {

        console.error(error);


        if (button) {

            button.disabled = false;

            button.innerText =
                "🎟️ 確認送出抽獎資料";

        }


        showError(
            error.message
        );

    }

}

    const container =

        );


    container.innerHTML = `

// ==================================================
// 錯誤訊息
// ==================================================

function showError(
    message
) {

    const element =
        document.getElementById(
            "message"
        );


    if (!element) {

        alert(message);

        return;

    }


    element.innerHTML =

        `<span class="error">
            ❌
            ${escapeHtml(
                message
            )}
        </span>`;

}


// ==================================================
// 錯誤頁面
// ==================================================

function showErrorPage(
    message
) {

    const container =
        document.getElementById(
            "app"
        );


    container.innerHTML = `

        <div class="logo">
            ❌
        </div>

        <h1>
            闖關失敗
        </h1>

        <div class="lottery">

            <span class="error">

                ${escapeHtml(
                    message
                )}

            </span>

        </div>


        <button
            onclick="loadProgress()"
        >
            返回闖關首頁
        </button>

    `;

}


// ==================================================
// HTML Escape
// ==================================================

function escapeHtml(
    value
) {

    if (value == null) {

        return "";

    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
